 fill="white"/><text x="378" y="798" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">No</text><polyline points="570,873 570,901" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="599.05" y="875" width="37.900000000000006" height="23" rx="3" fill="white"/><text x="618" y="892" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">Yes</text><rect x="45" y="73" width="300" height="94" rx="30" fill="#164a42" stroke="#83a394" stroke-width="2"/><text x="195" y="113.5" text-anchor="middle" font-family="Arial" font-size="21" fill="white"><tspan x="195" dy="0">Staff creates account</tspan><tspan x="195" dy="25">or resends setup</tspan></text><rect x="795" y="73" width="300" height="94" rx="30" fill="#164a42" stroke="#83a394" stroke-width="2"/><text x="945" y="113.5" text-anchor="middle" font-family="Arial" font-size="21" fill="white"><tspan x="945" dy="0">User submits</tspan><tspan x="945" dy="25">Forgot password</tspan></text><rect x="45" y="211" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="195" y="251.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="195" dy="0">Save account; request</tspan><tspan x="195" dy="25">24-hour setup link</tspan></text><rect x="795" y="211" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="945" y="251.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="945" dy="0">Generic reset response;</tspan><tspan x="945" dy="25">send if account exists</tspan></text><rect x="420" y="349" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="570" y="389.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Open first-login or</tspan><tspan x="570" dy="25">reset-password token</tspan></text><polygon points="570,471 740,534 570,597 400,534" fill="#fff4d8" stroke="#b