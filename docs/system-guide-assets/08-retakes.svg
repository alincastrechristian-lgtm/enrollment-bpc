<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1214" viewBox="0 0 1140 1214"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#58766b"/></marker></defs><text x="45" y="37" font-family="Arial" font-size="21" font-weight="bold" fill="#164a42">Outstanding failed and incomplete subjects</text><text x="45" y="65" font-family="Arial" font-size="16" fill="#61776e">Rectangle: action  •  Diamond: decision  •  Rounded: entry/result  •  Unlabeled: continue</text><polyline points="570,167 570,211" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="570,305 570,333" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="400,396 195,396 195,487" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="264.6" y="367" width="65.80000000000001" height="23" rx="3" fill="white"/><text x="297.5" y="384" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">Passed</text><polyline points="740,396 945,396 945,487" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="804.95" y="367" width="75.10000000000001" height="23" rx="3" fill="white"/><text x="842.5" y="384" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">Concern</text><polyline points="945,581 945,625" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="945,719 945,747" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="775,810 720,810" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="728.55" y="781" width="37.900000000000006" height="23" rx="3" fill="white"/><text x="747.5" y="798" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">Yes</text><polyline points="945,873 945,901" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="978.7" y="875" width="28.6" height="23" rx="3" fill="white"/><text x="993" y="892" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">No</text><polyline points="945,995 945,1039" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="420" y="73" width="300" height="94" rx="30" fill="#164a42" stroke="#83a394" stroke-width="2"/><text x="570" y="113.5" text-anchor="middle" font-family="Arial" font-size="21" fill="white"><tspan x="570" dy="0">Load finalized attempts;</tspan><tspan x="570" dy="25">exclude dropped/voided</tspan></text><rect x="420" y="211" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="570" y="251.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Keep latest attempt</tspan><tspan x="570" dy="25">for each subject</tspan></text><polygon points="570,333 740,396 570,459 400,396" fill="#fff4d8" stroke="#b18a32" stroke-width="2"/><text x="570" y="402" text-anchor="middle" font-family="Arial" font-size="18" fill="#183d32"><tspan x="570" dy="0">Latest result?</tspan></text><rect x="45" y="487" width="300" height="94" rx="30" fill="#e5f2eb" stroke="#83a394" stroke-width="2"/><text x="195" y="527.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="195" dy="0">1.00–3.00:</tspan><tspan x="195" dy="25">remove concern</tspan></text><rect x="795" y="487" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="945" y="527.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="945" dy="0">Above 3.00: failed;</tspan><tspan x="945" dy="25">null: incomplete</tspan></text><rect x="795" y="625" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="945" y="665.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="945" dy="0">Show outstanding list;</tspan><tspan x="945" dy="25">add one or add all</tspan></text><polygon points="945,747 1115,810 945,873 775,810" fill="#fff4d8" stroke="#b18a32" stroke-width="2"/><text x="945" y="816" text-anchor="middle" font-family="Arial" font-size="18" fill="#183d32"><tspan x="945" dy="0">Already in draft?</tspan></text><rect x="420" y="763" width="300" height="94" rx="30" fill="#e5f2eb" stroke="#83a394" stroke-width="2"/><text x="570" y="816" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Skip duplicate</tspan></text><rect x="795" y="901" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="945" y="941.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="945" dy="0">Choose term units</tspan><tspan x="945" dy="25">or prior attempt units</tspan></text><rect x="795" y="1039" width="300" height="94" rx="30" fill="#e5f2eb" stroke="#83a394" stroke-width="2"/><text x="945" y="1079.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="945" dy="0">Save with enrollment;</tspan><tspan x="945" dy="25">no automatic retake</tspan></text></svg>