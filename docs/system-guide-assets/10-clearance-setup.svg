<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1352" viewBox="0 0 1140 1352"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#58766b"/></marker></defs><text x="45" y="37" font-family="Arial" font-size="21" font-weight="bold" fill="#164a42">Admin clearance configuration and test</text><text x="45" y="65" font-family="Arial" font-size="16" fill="#61776e">Rectangle: action  •  Diamond: decision  •  Rounded: entry/result  •  Unlabeled: continue</text><polyline points="570,167 570,211" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="570,305 570,349" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="570,443 570,487" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="570,581 570,625" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="570,719 570,763" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="570,857 570,901" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="570,995 570,1023" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="400,1086 345,1086" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="358.2" y="1057" width="28.6" height="23" rx="3" fill="white"/><text x="372.5" y="1074" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">No</text><polyline points="570,1149 570,1177" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="599.05" y="1151" width="37.900000000000006" height="23" rx="3" fill="white"/><text x="618" y="1168" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">Yes</text><rect x="420" y="73" width="300" height="94" rx="30" fill="#164a42" stroke="#83a394" stroke-width="2"/><text x="570" y="113.5" text-anchor="middle" font-family="Arial" font-size="21" fill="white"><tspan x="570" dy="0">Admin opens</tspan><tspan x="570" dy="25">Settings &gt; Clearance</tspan></text><rect x="420" y="211" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="570" y="251.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Upload blank reference:</tspan><tspan x="570" dy="25">JPEG, PNG or WebP</tspan></text><rect x="420" y="349" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="570" y="389.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Blank reference saved;</tspan><tspan x="570" dy="25">adjust outline corners</tspan></text><rect x="420" y="487" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="570" y="527.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Define permanent printed</tspan><tspan x="570" dy="25">anchors and office regions</tspan></text><rect x="420" y="625" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="570" y="665.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Map student name/number;</tspan><tspan x="570" dy="25">inspect all saved regions</tspan></text><rect x="420" y="763" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="570" y="803.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Save validated definition;</tspan><tspan x="570" dy="25">issue fresh revision</tspan></text><rect x="420" y="901" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="570" y="941.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Browser-test anchors;</tspan><tspan x="570" dy="25">office marks not tested</tspan></text><polygon points="570,1023 740,1086 570,1149 400,1086" fill="#fff4d8" stroke="#b18a32" stroke-width="2"/><text x="570" y="1081.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#183d32"><tspan x="570" dy="0">Aligned and</tspan><tspan x="570" dy="21">findings useful?</tspan></text><rect x="45" y="1039" width="300" height="94" rx="30" fill="#e5f2eb" stroke="#83a394" stroke-width="2"/><text x="195" y="1079.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="195" dy="0">Adjust regions;</tspan><tspan x="195" dy="25">save new revision</tspan></text><rect x="420" y="1177" width="300" height="94" rx="30" fill="#e5f2eb" stroke="#83a394" stroke-width="2"/><text x="570" y="1217.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Students can submit</tspan><tspan x="570" dy="25">against saved template</tspan></text></svg>