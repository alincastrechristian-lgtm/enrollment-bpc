<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="938" viewBox="0 0 1140 938"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#58766b"/></marker></defs><text x="45" y="37" font-family="Arial" font-size="21" font-weight="bold" fill="#164a42">Password change and two-factor authentication</text><text x="45" y="65" font-family="Arial" font-size="16" fill="#61776e">Rectangle: action  •  Diamond: decision  •  Rounded: entry/result  •  Unlabeled: continue</text><polyline points="570,167 570,211" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="420,258 195,258 195,349" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="355.8" y="229" width="84.4" height="23" rx="3" fill="white"/><text x="398" y="246" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">Password</text><polyline points="720,258 945,258 945,349" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="723.05" y="229" width="37.900000000000006" height="23" rx="3" fill="white"/><text x="742" y="246" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">2FA</text><polyline points="195,443 195,487" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="195,581 195,625" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="945,443 945,487" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="945,581 945,625" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="945,719 945,763" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="420" y="73" width="300" height="94" rx="30" fill="#164a42" stroke="#83a394" stroke-width="2"/><text x="570" y="113.5" text-anchor="middle" font-family="Arial" font-size="21" fill="white"><tspan x="570" dy="0">Signed-in user opens</tspan><tspan x="570" dy="25">Settings &gt; Security</tspan></text><rect x="420" y="211" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="570" y="251.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Choose security</tspan><tspan x="570" dy="25">operation</tspan></text><rect x="45" y="349" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="195" y="389.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="195" dy="0">Change password:</tspan><tspan x="195" dy="25">verify current password</tspan></text><rect x="795" y="349" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="945" y="389.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="945" dy="0">Enable 2FA: confirm</tspan><tspan x="945" dy="25">password; QR/manual key</tspan></text><rect x="45" y="487" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="195" y="527.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="195" dy="0">Validate new password;</tspan><tspan x="195" dy="25">revoke other sessions</tspan></text><rect x="795" y="487" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="945" y="527.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="945" dy="0">Save recovery codes;</tspan><tspan x="945" dy="25">then verify app code</tspan></text><rect x="45" y="625" width="300" height="94" rx="30" fill="#e5f2eb" stroke="#83a394" stroke-width="2"/><text x="195" y="678" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="195" dy="0">Password changed</tspan></text><rect x="795" y="625" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="945" y="665.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="945" dy="0">Next login needs TOTP</tspan><tspan x="945" dy="25">or unused recovery code</tspan></text><rect x="795" y="763" width="300" height="94" rx="30" fill="#e5f2eb" stroke="#83a394" stroke-width="2"/><text x="945" y="803.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="945" dy="0">Disable 2FA with</tspan><tspan x="945" dy="25">current password</tspan></text></svg>