<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1214" viewBox="0 0 1140 1214"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#58766b"/></marker></defs><text x="45" y="37" font-family="Arial" font-size="21" font-weight="bold" fill="#164a42">Drop a real enrollment and enroll again</text><text x="45" y="65" font-family="Arial" font-size="16" fill="#61776e">Rectangle: action  •  Diamond: decision  •  Rounded: entry/result  •  Unlabeled: continue</text><polyline points="570,167 570,211" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="570,305 570,349" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="570,443 570,487" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="570,581 570,625" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="570,719 570,763" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="570,857 570,901" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="570,995 570,1039" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="420" y="73" width="300" height="94" rx="30" fill="#164a42" stroke="#83a394" stroke-width="2"/><text x="570" y="113.5" text-anchor="middle" font-family="Arial" font-size="21" fill="white"><tspan x="570" dy="0">Staff selects Drop on</tspan><tspan x="570" dy="25">current enrolled record</tspan></text><rect x="420" y="211" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="570" y="251.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Confirm action</tspan><tspan x="570" dy="25">and consequences</tspan></text><rect x="420" y="349" width="300" height="94