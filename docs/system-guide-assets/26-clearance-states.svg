<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1076" viewBox="0 0 1140 1076"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#58766b"/></marker></defs><text x="45" y="37" font-family="Arial" font-size="21" font-weight="bold" fill="#164a42">Saved clearance states and their permitted transitions</text><text x="45" y="65" font-family="Arial" font-size="16" fill="#61776e">Rectangle: action  •  Diamond: decision  •  Rounded: entry/result  •  Unlabeled: continue</text><polyline points="570,167 570,211" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="570,305 570,349" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="570,443 570,471" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="400,534 195,534 195,625" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="264.6" y="505" width="65.80000000000001" height="23" rx="3" fill="white"/><text x="297.5" y="522" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">Reject</text><polyline points="740,534 945,534 945,625" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="809.6" y="505" width="65.80000000000001" height="23" rx="3" fill="white"/><text x="842.5" y="522" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">Verify</text><polyline points="195,719 195,763" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="945,719 945,763" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="960.1" y="729" width="65.80000000000001" height="23" rx="3" fill="white"/><text x="993" y="746" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">Reopen</text><polyline points="945,857 945,948 720,948" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="941.5" y="890.5" width="103" height="23" rx="3" fill="white"/><text x="993" y="907.5" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">New upload</text><polyline points="195,857 195,948 420,948" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="420" y="73" width="300" height="94" rx="30" fill="#164a42" stroke="#83a394" stroke-width="2"/><text x="570" y="126" text-anchor="middle" font-family="Arial" font-size="21" fill="white"><tspan x="570" dy="0">No saved submission</tspan></text><rect x="420" y="211" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="570" y="251.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Requestable image saved</tspan><tspan x="570" dy="25">ready: ID match or review</tspan></text><rect x="420" y="349" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="570" y="389.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Student requests;</tspan><tspan x="570" dy="25">status requested</tspan></text><polygon points="570,471 740,534 570,597 400,534" fill="#fff4d8" stroke="#b18a32" stroke-width="2"/><text x="570" y="540" text-anchor="middle" font-family="Arial" font-size="18" fill="#183d32"><tspan x="570" dy="0">Staff decision</tspan></text><rect x="45" y="625" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="195" y="678" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="195" dy="0">Rejected with reason</tspan></text><rect x="795" y="625" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="945" y="665.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="945" dy="0">Verified; enrollment</tspan><tspan x="945" dy="25">clearance complete</tspan></text><rect x="795" y="763" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="945" y="803.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="945" dy="0">Drop/reopen invalidates;</tspan><tspan x="945" dy="25">restore upload eligibility</tspan></text><rect x="45" y="763" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="195" y="803.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="195" dy="0">Correct form; upload</tspan><tspan x="195" dy="25">eligible replacement</tspan></text><rect x="420" y="901" width="300" height="94" rx="30" fill="#e5f2eb" stroke="#83a394" stroke-width="2"/><text x="570" y="941.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Replacement ready;</tspan><tspan x="570" dy="25">student requests again</tspan></text></svg>