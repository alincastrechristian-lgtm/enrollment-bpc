="795" y="1177" width="300" height="94" rx="30" fill="#e5f2eb" stroke="#83a394" stroke-width="2"/><text x="945" y="1217.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="945" dy="0">Continuing students keep</tspan><tspan x="945" dy="25">their assigned version</tspan></text><rect x="420" y="1315" width="300" height="94" rx="30" fill="#e5f2eb" stroke="#83a394" stroke-width="2"/><text x="570" y="1355.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">New students/transfers</tspan><tspan x="570" dy="25">use active version</tspan></text></svg>