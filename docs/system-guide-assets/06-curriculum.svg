<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1490" viewBox="0 0 1140 1490"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#58766b"/></marker></defs><text x="45" y="37" font-family="Arial" font-size="21" font-weight="bold" fill="#164a42">Curriculum-owned prerequisites, validation and frozen publication</text><text x="45" y="65" font-family="Arial" font-size="16" fill="#61776e">Rectangle: action  •  Diamond: decision  •  Rounded: entry/result  •  Unlabeled: continue</text><polyline points="570,167 570,211" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="570,305 570,349" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="570,443 570,487" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="570,581 570,609" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="400,672 345,672" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="358.2" y="643" width="28.6" height="23" rx="3" fill="white"/><text x="372.5" y="660" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">No</text><polyline points="195,625 195,534 420,534" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="210.1" y="567.5" width="65.80000000000001" height="23" rx="3" fill="white"/><text x="243" y="584.5" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">Revise</text><polyline points="570,735 570,763" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="599.05" y="737" width="37.900000000000006" height="23" rx="3" fill="white"/><text x="618" y="754" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">Yes</text><polyline points="570,857 570,901" fill="none" stroke="#5876