"94" rx="30" fill="#164a42" stroke="#83a394" stroke-width="2"/><text x="570" y="113.5" text-anchor="middle" font-family="Arial" font-size="21" fill="white"><tspan x="570" dy="0">Account or academic</tspan><tspan x="570" dy="25">event occurs</tspan></text><polygon points="570,195 740,258 570,321 400,258" fill="#fff4d8" stroke="#b18a32" stroke-width="2"/><text x="570" y="264" text-anchor="middle" font-family="Arial" font-size="18" fill="#183d32"><tspan x="570" dy="0">Which event path?</tspan></text><rect x="45" y="349" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="195" y="389.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="195" dy="0">Meeting: attempt email</tspan><tspan x="195" dy="25">under send claim</tspan></text><rect x="420" y="349" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="570" y="389.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Most academic actions:</tspan><tspan x="570" dy="25">commit state + event</tspan></text><rect x="795" y="349" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="945" y="389.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="945" dy="0">Document request/decision:</tspan><tspan x="945" dy="25">commit event; no email</tspan></text><polygon points="195,471 365,534 195,597 25,534" fill="#fff4d8" stroke="#b18a32" stroke-width="2"/><text x="195" y="529.5" text-anchor="middle" font-family="Arial" font-size="18" fill="#183d32"><tspan x="195" dy="0">Meeting email</tspan><tspan x="195" dy="21">accepted?</tspan></text><rect x="420" y="487" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="570" y="540" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Attempt email after commit</tspan></text><rect x="45" y="625" width="300" height="94" rx="30" fill="#e5f2eb" stroke="#83a394" stroke-width="2"/><text x="195" y="665.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="195" dy="0">Failure: release claim;</tspan><tspan x="195" dy="25">no meeting event/sent flag</tspan></text><polygon points="570,609 740,672 570,735 400,672" fill="#fff4d8" stroke="#b18a32" stroke-width="2"/><text x="570" y="678" text-anchor="middle" font-family="Arial" font-size="18" fill="#183d32"><tspan x="570" dy="0">Mail accepted?</tspan></text><rect x="795" y="625" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="945" y="653" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="945" dy="0">Failure: saved state +</tspan><tspan x="945" dy="25">event remain; report</tspan><tspan x="945" dy="25">outcome</tspan></text><rect x="45" y="763" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="195" y="803.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="195" dy="0">Accepted meeting: save</tspan><tspan x="195" dy="25">event + sent timestamp</tspan></text><rect x="420" y="763" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="570" y="803.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Provider acceptance is</tspan><tspan x="570" dy="25">not inbox receipt</tspan></text><rect x="420" y="901" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="570" y="941.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Same role scope for lists,</tspan><tspan x="570" dy="25">counts, search and filters</tspan></text><rect x="45" y="1039" width="300" height="94" rx="30" fill="#e5f2eb" stroke="#83a394" stroke-width="2"/><text x="195" y="1079.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="195" dy="0">Student: own recipient;</tspan><tspan x="195" dy="25">own read/unread controls</tspan></text><rect x="420" y="1039" width="300" height="94" rx="30" fill="#e5f2eb" stroke="#83a394" stroke-width="2"/><text x="570" y="1079.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Registrar: own actor;</tspan><tspan x="570" dy="25">no unread/read mutations</tspan></text><rect x="795" y="1039" width="300" height="94" rx="30" fill="#e5f2eb" stroke="#83a394" stroke-width="2"/><text x="945" y="1067" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="945" dy="0">Admin: own actor/recipient</tspan><tspan x="945" dy="25">+ all enrollment_dropped;</tspan><tspan x="945" dy="25">no student read mutations</tspan></text></svg>