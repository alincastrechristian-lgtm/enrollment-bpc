<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1214" viewBox="0 0 1140 1214"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#58766b"/></marker></defs><text x="45" y="37" font-family="Arial" font-size="21" font-weight="bold" fill="#164a42">Saved event scope, mail exceptions and student read state</text><text x="45" y="65" font-family="Arial" font-size="16" fill="#61776e">Rectangle: action  •  Diamond: decision  •  Rounded: entry/result  •  Unlabeled: continue</text><polyline points="570,167 570,195" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="400,258 195,258 195,349" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="259.95" y="229" width="75.10000000000001" height="23" rx="3" fill="white"/><text x="297.5" y="246" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">Meeting</text><polyline points="570,321 570,349" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="575.8" y="323" width="84.4" height="23" rx="3" fill="white"/><text x="618" y="340" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">Academic</text><polyline points="740,258 945,258 945,349" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="795.65" y="229" width="93.7" height="23" rx="3" fill="white"/><text x="842.5" y="246" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">Documents</text><polyline points="195,443 195,471" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="195,597 195,625" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="228.7" y="599" width="28.6" height="23" rx="3" fill="white"/><text x="243" y="616" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">No</text