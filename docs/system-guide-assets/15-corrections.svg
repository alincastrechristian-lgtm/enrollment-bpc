<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1076" viewBox="0 0 1140 1076"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#58766b"/></marker></defs><text x="45" y="37" font-family="Arial" font-size="21" font-weight="bold" fill="#164a42">Correct, void or reopen an enrollment with audit history</text><text x="45" y="65" font-family="Arial" font-size="16" fill="#61776e">Rectangle: action  •  Diamond: decision  •  Rounded: entry/result  •  Unlabeled: continue</text><polyline points="570,167 570,195" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="400,258 345,258" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="358.2" y="229" width="28.6" height="23" rx="3" fill="white"/><text x="372.5" y="246" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">No</text><polyline points="570,321 570,349" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="599.05" y="323" width="37.900000000000006" height="23" rx="3" fill="white"/><text x="618" y="340" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">Yes</text><polyline points="420,396 195,396 195,487" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="269.95" y="367" width="75.10000000000001" height="23" rx="3" fill="white"/><text x="307.5" y="384" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">Correct</text><polyline points="570,443 570,487" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="594.4" y="453" width="47.2" height="23" rx="3" fill="white"/><text x="618" y="470" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">Void</text><polyline points="720,396 945,396 945,487" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="799.6" y="367" width="65.80000000000001" height="23" rx="3" fill="white"/><text x="832.5" y="384" text-anchor="middle" font-family="Arial" font-size="17" fill="#40584f">Reopen</text><polyline points="195,581 195,625" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="570,581 570,625" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="945,581 945,625" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="195,719 195,810 420,810" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="570,719 570,763" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="945,719 945,810 720,810" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><polyline points="570,857 570,901" fill="none" stroke="#58766b" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="420" y="73" width="300" height="94" rx="30" fill="#164a42" stroke="#83a394" stroke-width="2"/><text x="570" y="113.5" text-anchor="middle" font-family="Arial" font-size="21" fill="white"><tspan x="570" dy="0">Staff selects action</tspan><tspan x="570" dy="25">and supplies reason</tspan></text><polygon points="570,195 740,258 570,321 400,258" fill="#fff4d8" stroke="#b18a32" stroke-width="2"/><text x="570" y="243" text-anchor="middle" font-family="Arial" font-size="18" fill="#183d32"><tspan x="570" dy="0">Role, revision and</tspan><tspan x="570" dy="21">lifecycle checks</tspan><tspan x="570" dy="21">pass?</tspan></text><rect x="45" y="211" width="300" height="94" rx="30" fill="#e5f2eb" stroke="#83a394" stroke-width="2"/><text x="195" y="251.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="195" dy="0">Reject stale or</tspan><tspan x="195" dy="25">forbidden action</tspan></text><rect x="420" y="349" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="570" y="389.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Run the selected</tspan><tspan x="570" dy="25">permitted action</tspan></text><rect x="45" y="487" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="195" y="527.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="195" dy="0">Correct unfinalized</tspan><tspan x="195" dy="25">enrolled record</tspan></text><rect x="420" y="487" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="570" y="527.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Void unfinalized</tspan><tspan x="570" dy="25">incorrect attempt</tspan></text><rect x="795" y="487" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="945" y="527.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="945" dy="0">Admin reopens finalized</tspan><tspan x="945" dy="25">enrolled/completed record</tspan></text><rect x="45" y="625" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="195" y="665.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="195" dy="0">Update details; preserve</tspan><tspan x="195" dy="25">matching draft grades</tspan></text><rect x="420" y="625" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="570" y="665.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Set voided; restore</tspan><tspan x="570" dy="25">valid current pointer</tspan></text><rect x="795" y="625" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="945" y="665.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="945" dy="0">Reset finalization,</tspan><tspan x="945" dy="25">clearance and follow-up</tspan></text><rect x="420" y="763" width="300" height="94" rx="9" fill="#f0f5f3" stroke="#83a394" stroke-width="2"/><text x="570" y="791" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Save before/after audit;</tspan><tspan x="570" dy="25">invalidate clearance if</tspan><tspan x="570" dy="25">needed</tspan></text><rect x="420" y="901" width="300" height="94" rx="30" fill="#e5f2eb" stroke="#83a394" stroke-width="2"/><text x="570" y="941.5" text-anchor="middle" font-family="Arial" font-size="21" fill="#183d32"><tspan x="570" dy="0">Notify student; attempt</tspan><tspan x="570" dy="25">email; retain history</tspan></text></svg>