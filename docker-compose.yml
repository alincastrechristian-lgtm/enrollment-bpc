services:
  app:
    image: aetherknowledge/enrollment-system:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: /app/data/local.db
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      GARAGE_ADMIN_ENDPOINT: ${GARAGE_ADMIN_ENDPOINT:-}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
      GARAGE_API_ENDPOINT: ${GARAGE_API_ENDPOINT:-}
      GARAGE_REGION: ${GARAGE_REGION:-garage}
      BODY_SIZE_LIMIT: 20M
    volumes:
      - ./data:/app/data
    restart: unless-stopped
