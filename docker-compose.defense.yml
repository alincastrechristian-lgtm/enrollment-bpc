name: enrollment-defense

services:
  gateway:
    image: ghcr.io/drizzle-team/gateway:latest
    ports:
      - '127.0.0.1:4983:4983'
    environment:
      PORT: 4983
      STORE_PATH: /app
      MASTERPASS: ${DRIZZLE_GATEWAY_MASTERPASS:?Set a separate strong Gateway master password}
    volumes:
      - gateway-config:/app
      - ./defense:/databases:ro
    restart: unless-stopped

volumes:
  gateway-config:
